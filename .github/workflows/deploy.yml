name: Publicar el sitio compilado

# main guarda el código. Cada vez que cambia, este flujo compila el sitio (npm run build)
# y publica el resultado en la rama `compiled`, que es la que despliega Hostinger en public_html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-compiled
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publicar dist en la rama compiled
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -e
          sha=$(git rev-parse --short HEAD)
          if git clone --quiet --depth 1 --branch compiled "$REMOTE" out; then
            find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            mkdir out
            git -C out init -q -b compiled
            git -C out remote add origin "$REMOTE"
          fi
          cp -a dist/. out/
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -q -m "Sitio compilado desde main@${sha}"
            git push origin compiled
          fi
