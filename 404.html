<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8f8f3">
  <title>Página no encontrada · Andrés Martínez</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    @font-face { font-family: Bricolage; src: url('/fonts/bricolage.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
    :root { font-family: Bricolage, sans-serif; color: #222a23; background: #f8f8f3; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    main { max-width: 560px; }
    p.code { margin: 0 0 14px; color: #3b6349; font-weight: 600; letter-spacing: .04em; }
    h1 { margin: 0; font-size: clamp(40px, 7vw, 68px); font-weight: 650; letter-spacing: -.04em; line-height: 1; }
    p { margin: 18px 0 0; color: #515b52; font-size: 18px; line-height: 1.5; }
    .links { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 30px; }
    a { color: inherit; }
    .button { display: inline-flex; align-items: center; min-height: 46px; padding-inline: 18px; border-radius: 6px; background: #222a23; color: #f8f8f3; font-weight: 600; text-decoration: none; }
    .button:hover { background: #3b6349; }
    .link { display: inline-flex; align-items: center; min-height: 46px; font-weight: 600; text-underline-offset: 5px; }
    a:focus-visible { outline: 3px solid #3b6349; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. El portfolio y el currículum siguen en su sitio.</p>
    <div class="links">
      <a class="button" href="/">Ir al portfolio</a>
      <a class="link" href="/cv/">Ver el CV</a>
    </div>
  </main>
</body>
</html>
